# テストして jar を作り、イメージを GHCR に push する。
# アプリは ../accounting-domain を composite build で取り込むため、2つのリポジトリを並べて checkout する。
name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      domain-ref:
        description: accounting-domain のブランチ・タグ
        default: main

env:
  IMAGE: ghcr.io/atsushiutsumi/accounting-app

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: accounting-app

      - uses: actions/checkout@v4
        with:
          repository: AtsushiUtsumi/accounting-domain
          ref: ${{ inputs.domain-ref || 'main' }}
          path: accounting-domain

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # テストは Testcontainers の PostgreSQL を使う(ランナーの Docker で動く)
      - name: Test and build the jar
        working-directory: accounting-app
        run: ./gradlew test bootJar

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: accounting-app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
