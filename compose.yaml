# 開発用の PostgreSQL。run.bat が起動する。
# 5432 番は既存の PostgreSQL と重なりやすいため、ホスト側は 15432 番にする。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
    ports:
      - "15432:5432"
    volumes:
      - accounting-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  accounting-data:
